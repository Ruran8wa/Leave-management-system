# Test Profile Configuration
spring.application.name=lms-application-test

# Use H2 in-memory database for tests (isolated from real database)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration (test values)
jwt.secret=test-secret-key-for-testing-purposes-must-be-at-least-256-bits
jwt.expiration=86400000

# Disable unnecessary features in tests
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# Logging
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
